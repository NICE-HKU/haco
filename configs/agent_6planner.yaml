



network_topology:
  zones: ["Global", "Regional", "Local"]

  matrix:
    Local_to_Local:     { base: 2,   jitter: 1,   bandwidth: 500, loss_rate: 0.0001  }
    Local_to_Regional:  { base: 150, jitter: 30,  bandwidth: 50, loss_rate: 0.02  }
    Local_to_Global:    { base: 800, jitter: 150, bandwidth: 10, loss_rate: 0.08  }

    Regional_to_Regional: { base: 40,  jitter: 10,  bandwidth: 100, loss_rate: 0.005 }
    Regional_to_Global:   { base: 350, jitter: 60,  bandwidth: 20, loss_rate: 0.01  }

    Global_to_Global:     { base: 60,  jitter: 15,  bandwidth: 200, loss_rate: 0.001 }


